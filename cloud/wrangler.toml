name = "runrun-camp-save"
main = "worker.js"
compatibility_date = "2026-01-01"

# —— 自定义域名 ——
# workers.dev 那个免费域名在国内会被 DNS 污染（解析到假 IP），
# 但 Cloudflare 边缘节点本身是通的（实测直连 0.15 秒）。
# 所以绑一个自己的域名来绕开污染。
#
# ⚠️ TOML 规则：顶层配置（routes / name / main 这些）必须写在
#    所有 [表] 和 [[数组表]] 的前面，否则会被当成上一个表的字段。
routes = [
  { pattern = "save.qiuzhiniao.work", custom_domain = true }
]

# 保留 workers.dev 那个地址当备用（国外能用，国内被污染）。
# 只写 routes 的话 wrangler 会自动关掉它。
workers_dev = true

# 存学习记录的 KV。id 换成你自己创建的那个：
#   npx wrangler kv namespace create SAVES
[[kv_namespaces]]
binding = "SAVES"
id = "40d0f1f850684ba093a979701bf5f57e"

[vars]
# 只允许指定来源访问。填 "*" 也能用，填具体网址更稳妥。
ALLOW_ORIGIN = "*"

# 配对码是密钥，不写在这个文件里（这个文件会进 git）。
# 用命令单独设置：
#   npx wrangler secret put CAMP_KEY
